<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple white noise generator for focus and relaxation">
  <title>White Noise Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>White Noise Generator</h1>
      <p class="subtitle">Focus. Relax. Sleep.</p>
    </header>

    <main>
      <section class="noise-types">
        <h2>Select Noise Type</h2>
        <div class="button-group">
          <button id="white-btn" class="noise-btn" data-type="white">White Noise</button>
          <button id="pink-btn" class="noise-btn" data-type="pink">Pink Noise</button>
          <button id="brown-btn" class="noise-btn" data-type="brown">Brown Noise</button>
        </div>
      </section>

      <section class="controls">
        <div class="volume-control">
          <label for="volume">
            Volume: <span id="volume-display">50</span>%
          </label>
          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="50"
            aria-label="Volume control"
          >
        </div>

        <button id="play-pause-btn" class="play-btn" disabled>
          <span class="play-text">Play</span>
        </button>
      </section>
    </main>

    <footer>
      <p>Built with Web Audio API</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
